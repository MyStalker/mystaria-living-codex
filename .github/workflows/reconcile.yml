name: Reconcile canonical sources
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force a safe reconciliation commit, without changing canon
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: source-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check source heads
        run: python scripts/reconcile.py ${{ inputs.force_rebuild && '--force' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish reconciliation marker
        run: |
          git add content/source-revisions.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Mystaria Canon Publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile Living Codex with canonical source heads'
          git push origin HEAD:main
